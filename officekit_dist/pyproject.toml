[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-placement"
version = "0.1.0"
description = "Worker Placement — put your capital to work deliberately: balance sheet, goals, strategies, adversarial courts, and a glass-box capability registry. Every dollar is a worker you place. One folder is the whole product."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
# Connectors ship BY DEFAULT: one install brings every first-class broker — no
# per-broker `pip install`. `wp doctor` back-fills these on a bare checkout.
# (Keep this list in sync with officekit_adapters.CONNECTOR_PACKAGES.)
dependencies = [
    "ib_insync>=0.9.86",   # Interactive Brokers — TWS / IB Gateway
    "robin_stocks>=3.0",   # Robinhood (equities + crypto)
    "pyotp>=2.8",          # Robinhood 2FA (TOTP)
    "openpyxl>=3.1,<4",   # Public benchmark and spreadsheet imports
]

[project.optional-dependencies]
ai = ["anthropic>=0.80,<1", "openai>=2,<3"]
ibkr = ["ib_insync>=0.9.86"]   # kept for back-compat; now also a core dep
dev = ["pytest>=8.0", "setuptools>=68", "wheel", "ruff>=0.4", "beautifulsoup4>=4.12"]

[project.scripts]
worker-placement = "officekit.cli:main"
wp = "officekit.cli:main"

[tool.setuptools]
packages = [
    "officekit",
    "officekit_ai",
    "officekit_agents",
    "officekit_adapters",
    "officekit_research",
    "officekit_signals",
]

[tool.setuptools.package-data]
# the shipped plane-1 corpus: court doctrine + suite directives + bench templates
officekit_agents = ["directives/*.md", "templates/*.md"]
officekit = ["public/*.html", "public/*.sh", "public/*.css", "public/*.js", "public/*.svg", "README.md", "INTAKE_AGENT.md", "bundled_strategies/*/*.json", "bundled_strategies/*/*.md", "PRD.md", "ARCHITECTURE.md", "SCHEMAS.md", "OPERATING_CONTRACTS.md", "COMMITMENTS.md", "STRATEGY_PROPOSALS.md", "HOSTED_ONBOARDING.md", "RESEARCH_CORPUS.md", "RESEARCH_CALIBRATION.md", "REVIEW_REPAIRS.md"]
