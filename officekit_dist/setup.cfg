# Mirror of pyproject.toml [project] for OLD toolchains (setuptools < 61 can't
# read PEP 621 metadata and silently builds UNKNOWN-0.0.0). Modern builders use
# pyproject.toml; keep the two in sync when bumping.
[metadata]
name = worker-placement
version = 0.1.0
description = Worker Placement - put your capital to work deliberately: balance sheet, goals, strategies, adversarial courts, and a glass-box capability registry. One folder is the whole product.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE, NOTICE, DATA_LICENSE.md

[options]
python_requires = >=3.9
install_requires =
    ib_insync>=0.9.86
    robin_stocks>=3.0
    pyotp>=2.8
    openpyxl>=3.1,<4
packages =
    officekit
    officekit_ai
    officekit_agents
    officekit_adapters
    officekit_research
    officekit_signals

[options.extras_require]
ai =
    anthropic>=0.80,<1
    openai>=2,<3
ibkr = ib_insync>=0.9.86
dev =
    pytest>=8.0
    setuptools>=68
    wheel
    ruff>=0.4
    beautifulsoup4>=4.12

[options.entry_points]
console_scripts =
    worker-placement = officekit.cli:main
    wp = officekit.cli:main

[options.package_data]
officekit_agents =
    directives/*.md
    templates/*.md
officekit =
    public/*.html
    public/*.sh
    public/*.css
    public/*.js
    public/*.svg
    README.md
    INTAKE_AGENT.md
    bundled_strategies/*/*.json
    bundled_strategies/*/*.md
    PRD.md
    ARCHITECTURE.md
    SCHEMAS.md
    OPERATING_CONTRACTS.md
    COMMITMENTS.md
    STRATEGY_PROPOSALS.md
    HOSTED_ONBOARDING.md
    RESEARCH_CORPUS.md
    RESEARCH_CALIBRATION.md
    REVIEW_REPAIRS.md
