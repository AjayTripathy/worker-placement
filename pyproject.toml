[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalos"
version = "0.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.25",
    "openai>=2,<3",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
signalos = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "store*", "verticals*"]
exclude = ["*.data*", "*.outputs*", "*.reports*", "*.tests*"]

[tool.pytest.ini_options]
markers = ["integration: hits live external APIs (deselect with -m 'not integration')", "corpus: audits unresolved historical data; distinct from synthetic implementation tests"]
