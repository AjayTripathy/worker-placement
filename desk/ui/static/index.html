<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk / SignalOS</title>
<style>
  :root{--bg:#0b0e14;--panel:#131722;--panel2:#1a1f2e;--line:#252b3b;--fg:#d7dce5;--mut:#7d869c;
        --grn:#26a17b;--amb:#e0a106;--red:#e0524a;--blu:#3d7eff;--vio:#9a6bff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;align-items:center;gap:16px;height:44px;padding:0 18px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#141926,#0b0e14);position:sticky;top:0;z-index:10}
  header h1{font-size:15px;margin:0;letter-spacing:.5px}
  header h1 b{color:var(--blu)} header .sig{color:var(--vio)}
  header .gen{color:var(--mut);font-size:11px;margin-left:auto}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 11px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--blu)} button:disabled{opacity:.6;cursor:wait;border-color:var(--amb)}
  .strip{display:flex;gap:10px;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-width:120px}
  .stat .k{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:20px;font-weight:600;margin-top:2px}
  .stat .s{font-size:10px;color:var(--mut)}
  .layout{display:flex;align-items:flex-start}
  nav{display:flex;flex-direction:column;gap:1px;padding:8px 6px;border-right:1px solid var(--line);
      width:128px;flex:0 0 128px;position:sticky;top:44px;max-height:calc(100vh - 44px);overflow-y:auto}
  nav a{padding:6px 10px;color:var(--mut);cursor:pointer;border-left:2px solid transparent;font-size:11.5px;
        border-radius:0 4px 4px 0;white-space:nowrap}
  nav a:hover{background:var(--panel)}
  nav a.on{color:var(--fg);border-left-color:var(--blu);background:var(--panel)}
  main{padding:14px 18px;flex:1;min-width:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--mut);font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line);
     font-size:10px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--bg)}
  td{padding:7px 9px;border-bottom:1px solid #1b2030;vertical-align:top}
  tr:hover td{background:var(--panel)}
  .tk{font-weight:600;color:#fff;cursor:pointer} .tk:hover{text-decoration:underline;color:var(--blu)}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;justify-content:center;
         align-items:flex-start;padding:36px 16px;overflow:auto}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:920px;width:100%;padding:20px 22px}
  .modal-card h3{margin:0 0 2px;font-size:17px} .modal-card .x{float:right;cursor:pointer;color:var(--mut);font-size:18px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;margin:6px 0} .kv .k2{color:var(--mut)}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;border:1px solid var(--line)}
  .grn{color:var(--grn);border-color:#1c5} .amb{color:var(--amb);border-color:#a80}
  .red{color:var(--red);border-color:#a33} .blu{color:var(--blu);border-color:#357} .mut{color:var(--mut)}
  .mdh1{font-weight:700;font-size:14px;color:#0d5c63;margin:2px 0 7px} .mdli{margin:3px 0 3px 4px} .mdp{margin:6px 0}
  .mdp code,.mdli code{background:#e7eef0;padding:1px 5px;border-radius:3px;font-size:12px}
  .exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
  .exbox{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.5;background:var(--panel2);color:var(--fg)}
  .exbox.exg{border-left:3px solid #3c9} .exbox.exr{border-left:3px solid #d85}
  .exh{font-weight:700;font-size:11.5px;margin-bottom:4px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .vio{color:var(--vio);border-color:#73a} .on{color:var(--grn)} .off{color:var(--mut)}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .bar>span{display:block;height:100%;background:var(--grn)}
  .sub{color:var(--mut);font-size:11px} .num{text-align:right;font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--mut)} details[open] summary{color:var(--fg)}
  .thesis{color:var(--sub);font-size:11px;max-width:560px;white-space:pre-wrap}
  .err{color:var(--red);padding:14px}
  .filter{margin-bottom:10px} .filter input,.filter select{background:var(--panel2);color:var(--fg);
         border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;margin-right:8px}
  a.doc{color:var(--blu);text-decoration:none} a.doc:hover{text-decoration:underline}
  h2.sec{font-size:13px;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px}
</style>
</head>
<body>
<header>
  <h1><b>DESK</b> / <span class="sig">SignalOS</span></h1>
  <span class="gen" id="gen">loading…</span>
  <button id="refreshBtn" onclick="boot(true)">↻ refresh</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script>
const TABS = ["office","scenarios","registry","theses","consumer","alerts","predictions","generators","strategy","briefs","gauntlet","mft","anti","atlas","diag","overview","entry","book","positions","parametric","factor","pnl","watches","detectors","triggers","catalysts","signals","harvest","research"];
let BOOK_FILTER = "All";
let DATA = {}, TAB = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "alerts";

async function boot(force){
  const btn=document.getElementById("refreshBtn"), gen=document.getElementById("gen");
  gen.textContent = force ? "⟳ refreshing live data… (~30s)" : "loading…";
  if(btn && force){ btn.disabled=true; btn.textContent="⟳ refreshing…"; }
  const t0=Date.now();
  try{
    // force -> ?fresh=1 recomputes live on the server; normal boot serves the instant cache
    DATA = await (await fetch("/api/everything"+(force?"?fresh=1":"?_="+Date.now()))).json();
    gen.textContent = "generated " + (DATA.overview?.generated||"") + (force?` · fresh in ${((Date.now()-t0)/1000).toFixed(0)}s`:"");
    renderNav(); render();
    if(location.hash.startsWith("#t=")) openDossier(decodeURIComponent(location.hash.slice(3)));
  } catch(e){
    gen.textContent = "refresh failed — showing last data";
  } finally {
    if(btn){ btn.disabled=false; btn.textContent="↻ refresh"; }
  }
}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function zoneCls(z){return /DEEP-ADD/.test(z)?"grn":/ENTRY/.test(z)?"grn":/WATCH/.test(z)?"amb":"mut";}
function sevCls(s){return s==="HIGH"?"red":s==="MED"?"amb":"mut";}

function renderStrip(){
  const o=DATA.overview||{}, s=document.getElementById("strip"); s.innerHTML="";
  const bk=o.detectors?.by_kind||{};
  const cards=[
    ["⚑ Alerts", (DATA.alerts?.counts?.go??"–")+" GO", (DATA.alerts?.counts?.no_go||0)+" no-go · "+(DATA.alerts?.counts?.review||0)+" review · "+(DATA.alerts?.counts?.edge||0)+" moved"],
    ["Watches", (o.watches?.enabled??"–")+"/"+(o.watches?.total??"–"), "enabled"],
    ["Detectors", o.detectors?.detectors??"–", (bk.detector||0)+" det · "+(bk.connector||0)+" conn · "+(bk.m_source||0)+" m-src"],
    ["Channels × Mech", (o.detectors?.channels??"–")+" × "+(o.detectors?.mechanisms??"–"), (o.detectors?.dispatch_indexed??"–")+" dispatch-indexed"],
    ["Catalysts", o.catalysts?.imminent??"–", (o.catalysts?.total??"–")+" tracked · imminent"],
    ["Book", (o.book?.smallcap??0)+(o.book?.krx??0), "active + "+(o.book?.verified??0)+" verified"],
    ["Watchlist", o.watchlist?.count??"–", (o.watchlist?.sleeves??0)+" research sleeves"],
    ["Positions", "$"+fmtK(o.positions?.equity_mv), (o.positions?.open_orders||0)+" open · harvest $"+fmtK(o.positions?.harvestable)],
    ["Signals", o.signals?.fresh??"–", (o.signals?.push??0)+" push · "+(o.signals?.actionable??0)+" actionable"],
    ["Harvest", (o.harvest?.pct_to_goal??"–")+"%", (o.harvest?.on_pace?"on pace":"gap $"+fmtK(o.harvest?.gap))],
    ["Research", o.research?.docs??"–", "documents"],
  ];
  cards.forEach(([k,v,sub])=>{const c=el("div","stat");c.append(el("div","k",k),el("div","v",v),el("div","s",sub));s.append(c);});
}
function renderNav(){
  const n=document.getElementById("nav"); n.innerHTML="";
  TABS.forEach(t=>{const a=el("a",t===TAB?"on":"",t.toUpperCase());a.onclick=()=>{TAB=t;location.hash=t;renderNav();render();};n.append(a);});
}
function fmtK(x){if(x==null)return"–";const a=Math.abs(x);return (x<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e3?(a/1e3).toFixed(0)+"k":a);}

function render(){
  const m=document.getElementById("main"); m.innerHTML="";
  const d=DATA[TAB];
  if(d&&d.error){m.append(el("div","err","⚠ "+d.error));return;}
  ({alerts:vAlerts,predictions:vPredictions,generators:vGenerators,overview:vOverview,entry:vEntry,book:vBook,watchlist:vWatchlist,positions:vPositions,parametric:vParametric,factor:vFactor,pnl:vPnl,watches:vWatches,detectors:vDetectors,
    triggers:vTriggers,catalysts:vCatalysts,signals:vSignals,harvest:vHarvest,research:vResearch,atlas:vAtlas,diag:vDiag,gauntlet:vGauntlet,anti:vAnti,mft:vMft,strategy:vStrategy,briefs:vBriefs,office:vOffice,scenarios:vScenarios,registry:vRegistry,theses:vTheses,consumer:vConsumer})[TAB](m);
}
function vStrategy(m){const f=document.createElement("iframe");f.src="/static/strategy_book.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0e1113;border-radius:6px";m.append(f);}
function vOffice(m){const f=document.createElement("iframe");f.src="/static/household.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0e1113;border-radius:6px";m.append(f);}
function vRegistry(m){const f=document.createElement("iframe");f.src="/static/registry.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0b0e12;border-radius:6px";m.append(f);}
function vScenarios(m){const f=document.createElement("iframe");f.src="/static/scenarios.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0b0e12;border-radius:6px";m.append(f);}
function vConsumer(m){const f=document.createElement("iframe");f.src="/static/consumer_heat.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0b0e12;border-radius:6px";m.append(f);}
function vTheses(m){const f=document.createElement("iframe");f.src="/static/thesis_index.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#0b0e12;border-radius:6px";m.append(f);}
function vBriefs(m){const f=document.createElement("iframe");f.src="/static/briefs.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#f6f5f1;border-radius:6px";m.append(f);}
function vMft(m){const f=document.createElement("iframe");f.src="/static/mft.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#FAFBFA;border-radius:6px";m.append(f);}
function vAnti(m){const f=document.createElement("iframe");f.src="/static/antibook.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#fff;border-radius:6px";m.append(f);}
function vGauntlet(m){const f=document.createElement("iframe");f.src="/static/gauntlet.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#fff;border-radius:6px";m.append(f);}
function vDiag(m){const f=document.createElement("iframe");f.src="/static/diag.html?"+Date.now();f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#fff;border-radius:6px";m.append(f);}
function vAtlas(m){const f=document.createElement("iframe");f.src="/static/atlas.html";f.style.cssText="width:100%;height:calc(100vh - 74px);border:0;background:#fff;border-radius:6px";m.append(f);}
function verdCls(v){return /OWN|HELD|STARTER/.test(v)?'grn':/AVOID|NOT_YET|SHORT/.test(v)?'red':/WATCH|DILIGENCE/.test(v)?'amb':'mut';}
function money(x){if(x==null)return'–';const s=x>=0?'grn':'red';return `<span class=${s}>${x>=0?'+':'-'}$${fmtK(Math.abs(x))}</span>`;}
function fmtP(x){return x==null?'–':'$'+(+x).toFixed(2);}
function ccyOf(yf){
  if(!yf)return'$';const s=(''+yf).toUpperCase();
  if(s.endsWith('.L'))return'GBp';
  if(/\.(PA|AS|MI|DE|BR|MC|VI|VIE|IR|LS|F)$/.test(s))return'€';
  if(s.endsWith('.SW')||s.endsWith('.VX'))return'CHF';
  if(s.endsWith('.AE'))return'AED';
  if(s.endsWith('.TA'))return'₪';        // quoted in agorot (÷100 = ILS)
  if(s.endsWith('.TO')||s.endsWith('.V'))return'C$';
  if(s.endsWith('.HK'))return'HK$';
  if(/\.(WA|WAR)$/.test(s))return'zł';
  if(/\.(KS|KQ)$/.test(s))return'₩';
  return'$';
}
function pxLbl(n){
  if(n.px==null)return'<span class=mut>–</span>';
  const c=ccyOf(n.yf);const live=n.live?' <span class=grn title="live">●</span>':'';
  if(c==='GBp')return'GBp '+n.px+' <span class=sub>(£'+(n.px/100).toFixed(2)+')</span>'+live;
  if(c==='₪')return'₪'+n.px+' <span class=sub>('+(n.px/100).toFixed(2)+' ILS)</span>'+live;
  return (c==='$'?'$'+n.px:c+' '+n.px)+live;
}
function table(cols){const t=el("table");const tr=el("tr");cols.forEach(c=>tr.append(el("th",null,c)));
  const th=el("thead");th.append(tr);t.append(th);const tb=el("tbody");t.append(tb);t._b=tb;return t;}
function callsHTML(calls){
  if(!calls||!calls.length) return '';
  let h='<div class=exbox style="grid-column:1/-1;margin-top:6px"><div class=exh>🎯 Our predictions on record</div>';
  calls.forEach(c=>{
    const st=c.status==='OPEN'?'<span class=amb>pending</span>':(c.resolution===true||c.resolution==='HIT'?'<span class=grn>✓ happened</span>':(c.resolution===false||c.resolution==='MISS'?'<span class=red>✗ didn\'t happen</span>':`<span class=mut>${(c.status||'').toLowerCase()}</span>`));
    const dt=c.cat_date?new Date(c.cat_date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'undated';
    h+=`<div style="margin:8px 0 2px"><b>${dt}</b> · ${st}</div>`;
    if(c.plain){
      h+=`<div class=mdli><b>What we're predicting:</b> ${c.plain.what}</div>`
        +`<div class=mdli><b>How we got our number:</b> ${c.plain.how}</div>`
        +`<div class=mdli><b>What we concluded:</b> ${c.plain.conclusion}</div>`;
    } else {
      const odds=c.p!=null?Math.round(c.p*100)+'%':'—';
      const mkt=c.market_p!=null?` (the market's pricing implies about ${Math.round(c.market_p*100)}%)`:'';
      h+=`<div class=mdli><b>What we're predicting:</b> ${(c.catalyst||'').replace(/_/g,' ')}</div>`;
      if(c.reasoning) h+=`<div class=mdli><b>How we got our number:</b> ${c.reasoning}</div>`;
      h+=`<div class=mdli><b>What we concluded:</b> We put the odds at ${odds}${mkt}.</div>`;
    }
  });
  return h+'</div>';
}
function row(tb,cells){const tr=el("tr");cells.forEach(c=>{const td=el("td");if(c&&c.nodeType)td.append(c);else td.innerHTML=c??"";tr.append(td);});tb.append(tr);}

// ---- ENTRY (highest-conviction orders to place today) ----
const CCY_SYM={USD:"$",EUR:"€",GBP:"p",PLN:"zł ",CHF:"CHF ",KRW:"₩"};
const LIQ_CLS={deep:"grn",work:"amb",THIN:"red"};
function vEntry(m){
  const EN=DATA.entry||{};
  if((EN.drift||[]).length){
    const w=el("div","exbox exr");
    w.innerHTML='<div class=exh>⚠️ Plan drift — staged file vs live adjudications</div>'+EN.drift.map(d=>`<div class=mdli>${d}</div>`).join('');
    m.append(w);}
  if((EN.live||[]).length){
    m.append(el("h2","sec","🟩 LIVE — approved entries from the ledger + records ("+EN.live.length+")"));
    const tb=table(["Name","Verdict","Size","Est $ (of $1mm)","Entry band","Dip alert","Approve"]);
    EN.live.forEach(r=>{
      const sz=r.sizing_pct_lo!=null?(r.sizing_pct_lo===r.sizing_pct_hi?r.sizing_pct_lo+"%":r.sizing_pct_lo+"-"+r.sizing_pct_hi+"%"):'<span class=red>NEEDS SIZING</span>';
      const usd=r.est_usd_lo?("$"+(r.est_usd_lo/1000)+"k"+(r.est_usd_hi>r.est_usd_lo?("-"+(r.est_usd_hi/1000)+"k"):"")):"";
      const btn=el("button",null,r.approved?"✅ approved":"APPROVE");
      btn.style.cssText="cursor:pointer;padding:3px 10px;border-radius:6px;border:1px solid "+(r.approved?"#4cc38a":"#888")+";background:"+(r.approved?"#123322":"transparent")+";color:inherit";
      btn.onclick=async()=>{btn.disabled=true;btn.textContent="…";
        try{const res=await fetch("/api/approve/"+encodeURIComponent(r.ticker),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({approved:!r.approved})});
          if(res.ok){r.approved=!r.approved;btn.textContent=r.approved?"✅ approved":"APPROVE";btn.style.borderColor=r.approved?"#4cc38a":"#888";btn.style.background=r.approved?"#123322":"transparent";}
          else{btn.textContent="failed";}
        }catch(e){btn.textContent="failed";}
        btn.disabled=false;};
      row(tb._b,[`<span class=tk>${r.ticker}</span>`,r.verdict,sz,usd,(r.entry_band||"").slice(0,45),r.alert_below??"",btn]);});
    m.append(tb);}

  const E=DATA.entry;
  if(!E||!E.orders||!E.orders.length){m.append(el("div","sub","No entry plan staged."));return;}
  m.append(el("h2","sec","Highest-conviction entries — sized to the $1mm target book"));
  m.append(el("div","sub",(E.note||"")));
  // summary bar
  const bar=el("div","filter");
  bar.append(el("span","pill blu",`target NLV $${(E.target_nlv||0).toLocaleString()}`));
  bar.append(el("span","pill",`funded cash $${(E.deployable_cash||0).toLocaleString()}`));
  bar.append(el("span","pill",`${E.count} targets · ~$${(E.total_est_usd||0).toLocaleString()} (${E.total_weight_pct}%)`));
  const appPill=el("span","pill "+(E.approved_over_cash?"red":"grn"),`${E.approved_count} approved · ~$${(E.approved_est_usd||0).toLocaleString()}`);
  bar.append(appPill);m.append(bar);
  if(E.approved_over_cash) m.append(el("div","err",`⚠ Approved ~$${(E.approved_est_usd||0).toLocaleString()} exceeds funded cash $${(E.deployable_cash||0).toLocaleString()} — place within cash now, or wait for the next funding chunk (or use margin).`));
  // group by tranche
  const byT={};E.orders.forEach(o=>{(byT[o.tranche||9]=byT[o.tranche||9]||[]).push(o);});
  Object.keys(byT).sort().forEach(tr=>{
    const grp=byT[tr];const cost=grp.reduce((s,o)=>s+(o.est_usd||0),0);
    m.append(el("h2","sec",`Tranche ${tr} — ${grp.length} name(s) · ~$${cost.toLocaleString()}`+(tr=="1"?"  (most-liquid, highest-conviction → do first)":"")));
    const t=table(["#","Ticker","Edge","Order (limit)","Qty","Est $","Wt%","Liq","Approve"]);
    grp.forEach(o=>{
      const sym=CCY_SYM[o.ccy]||"";
      const lim=o.ccy==="GBP"?`${sym}${o.limit} (£${(o.limit/100).toFixed(2)})`:`${sym}${o.limit}`;
      const det=el("details");det.append(el("summary",null,(o.grade||'')));det.append(el("div","thesis",o.conviction||''));
      const btn=el("button",null,o.approved?"✓ Approved":"Approve");
      btn.style.cssText="padding:4px 11px;"+(o.approved?"background:#143d23;color:#36d77d;border-color:#1d6b3c":"");
      btn.onclick=()=>approveOrder(o.ticker,!o.approved);
      const liq=o.liquidity?`<span class="pill ${LIQ_CLS[o.liquidity]||'mut'}" title="~${o.fill_days}d to fill at 25% ADV">${o.liquidity}${o.fill_days>1?" "+o.fill_days+"d":""}</span>`:'–';
      const ec=/EDGE/.test(o.edge||'')?'grn':/TRAP|DILIGENCE/.test(o.edge||'')?'amb':'mut';
      const edge=o.edge?`<span class="pill ${ec}" title="${o.target_price?'target '+o.target_price:''}">${o.edge}</span>${o.target_price?'<br><span class=sub>tgt '+o.target_price+'</span>':''}`:'–';
      row(t._b,[o.rank,
        `<details><summary><span class=tk>${o.ticker}</span></summary><div class=thesis>${(o.conviction||'')}</div></details><span class=sub>${o.name||''}</span>`,
        edge,`<b>${o.action} ${lim}</b>`,o.qty,

function mdLite(t){
  if(!t) return '';
  return t.split('\n').map(l=>{
    l=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
       .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
    if(/^# /.test(l)) return '<div class=mdh1>'+l.slice(2)+'</div>';
    if(/^\d+\. /.test(l)) return '<div class=mdli><b>'+l.match(/^\d+\./)[0]+'</b> '+l.replace(/^\d+\. /,'')+'</div>';
    if(/^- /.test(l)) return '<div class=mdli>• '+l.slice(2)+'</div>';
    if(l.trim()==='') return '';
    return '<div class=mdp>'+l+'</div>';
  }).join('');
}

  if((d.features||[]).length){h+=`<h2 class=sec>Detector coverage</h2>`+d.features.map(f=>`<span class="pill mut">${f}</span>`).join(" ");}
  h+=`<h2 class=sec>Research documents (${d.doc_count})</h2>`;
  if((d.docs||[]).length){const t=`<table><tbody>`+d.docs.map(i=>`<tr><td><a class=doc href="/doc?file=${encodeURIComponent(i.file)}" target=_blank>${i.title}</a><br><span class=sub>${i.file}</span></td><td><span class="pill ${({deck:'vio',dd:'blu',trap:'red',report:'mut'})[i.kind]||'mut'}">${i.kind}</span></td><td>`+
    (i.has_pdf?`<a class=doc href="/doc?file=${encodeURIComponent(i.file.replace(/\.md$/,'.pdf'))}" target=_blank>pdf</a> · `:"")+`<a class=doc href="/doc?file=${encodeURIComponent(i.file)}" target=_blank>md</a></td></tr>`).join("")+`</tbody></table>`; h+=t;}
  else h+="<div class=mut>none on file</div>";
  c.innerHTML=h;
}
boot();
// auto-refresh: re-fetch /api/everything on an interval so prices + the name list don't go stale in an open
// tab (the #1 "prices aren't refreshing / name missing" cause). Visibility-guarded so a backgrounded tab
// doesn't hammer yfinance; TAB + BOOK_FILTER are module-level so the view/filter survive the re-render.
setInterval(()=>{ if(document.visibilityState==='visible') boot(true); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') boot(true); });
</script>
</body>
</html>
